services:
  gateway:
    image: inductiveautomation/ignition:8.3.6
    ports:
      - "8088:8088"
    command: >
      -n docker-test
    volumes:
      - ./config/ignition/tag-definition:/usr/local/bin/ignition/data/config/resources/external/ignition/tag-definition
      - ./config/ignition/tag-type-definition:/usr/local/bin/ignition/data/config/resources/external/ignition/tag-type-definition