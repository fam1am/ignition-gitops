name: ignition-dev

services:
  gateway:
    image: inductiveautomation/ignition:8.3.6

    restart: unless-stopped

    # Image USER is 2003:2003. Start as root so the entrypoint can honor
    # IGNITION_UID/GID (gosu step-down). Without this, Designer saves to the
    # bind mounts fail with permission denied and never hit ./config.
    user: "0:0"

    environment:
      ACCEPT_IGNITION_EULA: "Y"
      IGNITION_UID: "${IGNITION_UID}"
      IGNITION_GID: "${IGNITION_GID}"

    command: >
      -n dev

    ports:
      - "8088:8088"

    volumes:
      #
      # Full Ignition runtime state
      #
      - ignition-data:/usr/local/bin/ignition/data

      #
      # Git-controlled TAGS
      #
      - type: bind
        source: ../config/ignition/tag-definition/default
        target: /usr/local/bin/ignition/data/config/resources/core/ignition/tag-definition/default

      #
      # Git-controlled UDTs
      #
      - type: bind
        source: ../config/ignition/tag-type-definition/default
        target: /usr/local/bin/ignition/data/config/resources/core/ignition/tag-type-definition/default

volumes:
  ignition-data:
    name: ignition-dev-data
